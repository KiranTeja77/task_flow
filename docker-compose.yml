services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-1.0}
        BUILD_NUMBER: ${BUILD_NUMBER:-local}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: ${DOCKERHUB_USER:-taskflow}/taskflow-backend:${IMAGE_TAG:-latest}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-taskflow}
      DB_USER: ${POSTGRES_USER:-taskflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
      JWT_SECRET: ${JWT_SECRET:-change-me-please-use-a-long-random-secret-key-32bytes}
      APP_VERSION: ${APP_VERSION:-1.0}
      BUILD_NUMBER: ${BUILD_NUMBER:-local}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "${BACKEND_PORT:-8090}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: ${DOCKERHUB_USER:-taskflow}/taskflow-frontend:${IMAGE_TAG:-latest}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
