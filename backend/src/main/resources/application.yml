server:
  port: 8080

spring:
  application:
    name: taskflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD:taskflow}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  version: ${APP_VERSION:1.0}
  build-number: ${BUILD_NUMBER:local}
  git-commit: ${GIT_COMMIT:unknown}
  seed: true
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-long-random-secret-key-32bytes}
    expiration-hours: 12
